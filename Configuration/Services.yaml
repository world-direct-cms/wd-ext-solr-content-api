services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WorldDirect\SolrContentApi\:
    resource: "../Classes/*"

  WorldDirect\SolrContentApi\EventListener\FileDeletionListener:
    tags:
      - name: event.listener
        identifier: solr-content-api-before-file-deleted
        event: TYPO3\CMS\Core\Resource\Event\BeforeFileDeletedEvent
        method: captureMetadataUids
      - name: event.listener
        identifier: solr-content-api-after-file-deleted
        event: TYPO3\CMS\Core\Resource\Event\AfterFileDeletedEvent
        method: persistDeletionEvents

  WorldDirect\SolrContentApi\EventListener\PageFilesIndexingListener:
    tags:
      - name: event.listener
        identifier: solr-content-api-page-files
        event: ApacheSolrForTypo3\Solr\Event\Indexing\AfterPageDocumentIsCreatedForIndexingEvent
